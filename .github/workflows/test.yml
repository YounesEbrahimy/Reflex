name: Unity Tests

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}

jobs:
  test:
    name: Run Unity Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: unityci/editor:ubuntu-6000.0.67f1-linux-il2cpp-3

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ runner.os }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-${{ runner.os }}-

      - name: Activate Unity
        run: |
          echo "$UNITY_LICENSE" > Unity_lic.ulf
          /opt/unity/Editor/Unity -nographics -batchmode -manualLicenseFile Unity_lic.ulf -logFile /dev/stdout -quit || true

      - name: Import project
        run: /opt/unity/Editor/Unity -projectPath . -batchmode -nographics -quit -logFile /dev/stdout

      - name: EditMode tests
        run: |
          mkdir -p artifacts
          /opt/unity/Editor/Unity -projectPath . -batchmode -nographics -runTests -testPlatform EditMode -testResults artifacts/editmode-results.xml -logFile /dev/stdout

      - name: PlayMode tests
        run: /opt/unity/Editor/Unity -projectPath . -batchmode -nographics -runTests -testPlatform PlayMode -testResults artifacts/playmode-results.xml -logFile /dev/stdout

      - name: Return license
        if: always()
        run: /opt/unity/Editor/Unity -batchmode -nographics -returnlicense -logFile /dev/stdout -quit || true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unity-test-results
          path: artifacts
